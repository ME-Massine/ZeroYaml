syntax = "proto3";

package zeroyaml.runner.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "io.zeroyaml.contracts.runner.v1";
option java_outer_classname = "RunnerProto";

option go_package = "github.com/MohamedMBG/ZeroYaml/runner/gen/runner/v1;runnerv1";

service RunnerService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetInfo(GetInfoRequest) returns (RunnerInfo);

  // RunJob dispatches one executable Job to this Runner process.
  //
  // The call acknowledges whether the Runner took responsibility for the Job;
  // it does not report execution progress or the execution outcome. Those are
  // separate contracts so that a dispatch never blocks on job duration.
  //
  // Failure behavior is split deliberately:
  //   - A request that violates the contract, such as a missing job identity or
  //     an empty command, fails with the gRPC status INVALID_ARGUMENT and
  //     produces no RunJobResponse. Such a request is a caller defect.
  //   - A well-formed request that the Runner declines returns OK with
  //     JOB_REJECTED and a rejection reason, because the refusal is a Runner
  //     state decision the Control Plane must record rather than retry blindly.
  rpc RunJob(RunJobRequest) returns (RunJobResponse);
}

// RunnerRegistrationService is implemented by the Control Plane. The Runner
// uses it to announce a process instance; persistence and lease management are
// intentionally outside this first contract.
service RunnerRegistrationService {
  rpc Register(RegisterRunnerRequest) returns (RegisterRunnerResponse);

  // Heartbeat reports that a previously registered Runner instance is still
  // alive. The Control Plane owns the meaning of a missed heartbeat and the
  // resulting liveness state; the Runner only reports that it is up.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// JobExecutionStatusService is implemented by the Control Plane. A Runner that
// accepted a Job through RunnerService.RunJob uses it to report what that
// execution did.
//
// The split of responsibility is deliberate. The Runner reports execution
// facts; the Control Plane owns the authoritative Job state, validates every
// transition, and decides what a report means for the pipeline. A Runner
// therefore never learns scheduling, retry, or cancellation policy here.
//
// The call is safe to repeat. Every report is reconciled against the state the
// Control Plane already recorded, so a duplicate or a late report is answered
// explicitly instead of corrupting the Job lifecycle.
service JobExecutionStatusService {
  rpc ReportJobStatus(ReportJobStatusRequest) returns (ReportJobStatusResponse);
}

message GetInfoRequest {}

message RunnerInfo {
  string runner_id = 1;
  string instance_id = 2;
  string runner_version = 3;
  string protocol_version = 4;
  RunnerCapabilities capabilities = 5;
  RunnerStatus status = 6;
  bool accepting_work = 7;
}

message RunnerCapabilities {
  string operating_system = 1;
  string architecture = 2;
  bool docker_available = 3;
  repeated string supported_executors = 4;
  map<string, string> labels = 5;
}

message RegisterRunnerRequest {
  RunnerInfo runner = 1;
}

message RegisterRunnerResponse {
  RegistrationResult result = 1;
  string registration_id = 2;
  string message = 3;
}

// HeartbeatRequest identifies the Runner instance reporting liveness. It
// reuses the registration identity pair instead of a new identity shape so
// the Control Plane reconciles it against the same registry entry.
message HeartbeatRequest {
  string runner_id = 1;
  string instance_id = 2;
}

message HeartbeatResponse {
  HeartbeatResult result = 1;
  string message = 2;
}

// HeartbeatResult separates an acknowledged heartbeat from one the Control
// Plane cannot attribute to a registered Runner. UNKNOWN_RUNNER covers a
// heartbeat sent before registration, after a Control Plane restart, and from
// an instance_id the registry no longer recognizes for that runner_id; the
// Runner must re-register rather than keep retrying the heartbeat.
enum HeartbeatResult {
  HEARTBEAT_RESULT_UNSPECIFIED = 0;
  HEARTBEAT_ACKNOWLEDGED = 1;
  HEARTBEAT_UNKNOWN_RUNNER = 2;
}

// RunJobRequest carries one dispatch decision made by the Control Plane. It
// contains no scheduling, retry, or pipeline policy: the Control Plane has
// already decided what runs, and the Runner only executes the supplied request.
message RunJobRequest {
  // Protocol contract understood by the caller, for example "runner.v1". A
  // Runner that does not support the value must reject the Job instead of
  // guessing the meaning of the remaining fields.
  string protocol_version = 1;

  JobSpecification job = 2;
}

// JobSpecification is the minimum executable description of one Job. Additional
// execution inputs must be added as new fields on this message rather than by
// encoding structured text into an existing field.
message JobSpecification {
  // Control Plane identity of the Job. It is stable for the lifetime of the Job
  // and lets both services correlate dispatch, execution, and audit records.
  string job_id = 1;

  JobRepository repository = 2;
  JobExecution execution = 3;
}

// JobRepository is provider-neutral source context. The Runner resolves it by
// the URI scheme and never infers a hosting provider from the Job identity.
message JobRepository {
  // Absolute repository URI.
  string location = 1;

  // Immutable source revision to execute, such as a commit SHA. A mutable
  // reference would make a Job non-reproducible.
  string revision = 2;
}

// JobExecution is a concrete command, not a workflow definition. The argument
// list avoids shell parsing on the Runner and keeps quoting rules out of the
// contract.
message JobExecution {
  // Ordered executable arguments; the first element is the executable.
  repeated string command = 1;

  // Directory in which the command runs, relative to the checked-out repository.
  string working_directory = 2;
}

// RunJobResponse acknowledges the dispatch. It never carries command output,
// exit codes, or partial execution state.
message RunJobResponse {
  // Echo of the dispatched job identity so a caller can correlate the
  // acknowledgment without relying on call ordering.
  string job_id = 1;

  JobAcceptance acceptance = 2;

  // Set only when acceptance is JOB_REJECTED.
  JobRejectionReason rejection_reason = 3;

  // Operator-facing diagnostic. It must not contain credentials or payloads.
  string message = 4;

  // Runner process that answered. The pair identifies the process the Control
  // Plane records against the Job once the Job is accepted.
  string runner_id = 5;
  string instance_id = 6;
}

enum RunnerStatus {
  RUNNER_STATUS_UNSPECIFIED = 0;
  RUNNER_STATUS_STARTING = 1;
  RUNNER_STATUS_READY = 2;
  RUNNER_STATUS_DRAINING = 3;
  RUNNER_STATUS_UNAVAILABLE = 4;
}

enum RegistrationResult {
  REGISTRATION_RESULT_UNSPECIFIED = 0;
  REGISTRATION_ACCEPTED = 1;
  REGISTRATION_ALREADY_REGISTERED = 2;
  REGISTRATION_IDENTITY_CONFLICT = 3;
}

// JobAcceptance separates a Runner that took responsibility for a Job from one
// that declined it. A caller must treat JOB_ACCEPTANCE_UNSPECIFIED as a
// protocol error rather than as an acceptance.
enum JobAcceptance {
  JOB_ACCEPTANCE_UNSPECIFIED = 0;
  JOB_ACCEPTED = 1;
  JOB_REJECTED = 2;
}

// JobRejectionReason explains a declined dispatch. New reasons are additive, so
// a caller must handle an unknown value as a rejection it cannot interpret.
enum JobRejectionReason {
  JOB_REJECTION_REASON_UNSPECIFIED = 0;

  // The Runner does not implement the protocol version named by the caller.
  JOB_REJECTION_UNSUPPORTED_PROTOCOL_VERSION = 1;

  // The Runner is not accepting work, for example while starting or draining.
  // The Control Plane may dispatch the Job to another Runner.
  JOB_REJECTION_RUNNER_UNAVAILABLE = 2;
}

// ReportJobStatusRequest carries one observation made by the Runner process
// that executes a Job. It reports what happened, never what the Control Plane
// should do about it.
message ReportJobStatusRequest {
  // Protocol contract understood by the caller, for example "runner.v1". A
  // Control Plane that does not implement the value must reject the report
  // instead of guessing the meaning of the remaining fields.
  string protocol_version = 1;

  // Control Plane identity of the Job, as dispatched in RunJobRequest.
  string job_id = 2;

  // Runner process reporting the execution. A report from a process the Job is
  // not assigned to is refused, because only the executing process observes
  // these facts.
  string runner_id = 3;
  string instance_id = 4;

  JobExecutionState state = 5;

  // When the Runner started executing the Job. Every report repeats it,
  // including a terminal one, so that a lost running report cannot leave a
  // finished Job without a start time.
  google.protobuf.Timestamp started_at = 6;

  // When execution ended. Set only for a terminal state.
  google.protobuf.Timestamp completed_at = 7;

  // Terminal outcome detail. Set only for a terminal state.
  JobExecutionResult result = 8;
}

// JobExecutionResult describes how one execution ended.
message JobExecutionResult {
  // Exit code reported by the executed command. It is absent when no command
  // produced one, for example when the Runner could not start it or stopped it
  // on timeout, so a caller must never read an absent code as a successful 0.
  optional int32 exit_code = 1;

  // Set only when state is JOB_EXECUTION_FAILED.
  JobExecutionFailureReason failure_reason = 2;

  // Operator-facing diagnostic. It must not contain credentials, environment
  // values, or captured command output; logs are a separate contract.
  string failure_message = 3;
}

// ReportJobStatusResponse states how the Control Plane reconciled one report
// against the Job state it owns.
message ReportJobStatusResponse {
  // Echo of the reported Job identity so a caller can correlate the answer
  // without relying on call ordering.
  string job_id = 1;

  JobStatusReportResult result = 2;

  // Authoritative Job state after reconciliation. It is unspecified only when
  // the Control Plane does not know the Job. A Runner may use it to learn that
  // its Job was already cancelled, but it must not derive policy from it.
  JobLifecycleState job_state = 3;

  // Operator-facing diagnostic. It must not contain credentials or payloads.
  string message = 4;
}

// JobExecutionState is the execution fact a Runner reports. It carries no
// queued state, because queueing is a Control Plane decision a Runner never
// observes, and no cancelled state, because a Runner reports a cancelled or
// timed-out execution as JOB_EXECUTION_FAILED with the matching reason.
enum JobExecutionState {
  JOB_EXECUTION_STATE_UNSPECIFIED = 0;
  JOB_EXECUTION_RUNNING = 1;
  JOB_EXECUTION_SUCCEEDED = 2;
  JOB_EXECUTION_FAILED = 3;
}

// JobExecutionFailureReason explains a failed execution. New reasons are
// additive, so a caller must handle an unknown value as a failure it cannot
// categorize rather than as a success.
enum JobExecutionFailureReason {
  JOB_EXECUTION_FAILURE_REASON_UNSPECIFIED = 0;

  // The command ran to completion and exited with a non-zero code.
  JOB_EXECUTION_FAILURE_NON_ZERO_EXIT = 1;

  // The Runner stopped the execution because it exceeded its time budget.
  JOB_EXECUTION_FAILURE_TIMEOUT = 2;

  // The execution was stopped before it finished, for example while the Runner
  // was shutting down.
  JOB_EXECUTION_FAILURE_CANCELLED = 3;

  // The Runner could not execute the Job at all, for example because the
  // workspace or the executor could not be prepared.
  JOB_EXECUTION_FAILURE_EXECUTION_ERROR = 4;
}

// JobStatusReportResult separates a report that advanced the Job from one the
// Control Plane deliberately did not apply. Only APPLIED changes Job state; the
// remaining values leave it untouched, which is what makes the call safe to
// repeat.
enum JobStatusReportResult {
  JOB_STATUS_REPORT_RESULT_UNSPECIFIED = 0;

  // The report moved the Job to a new authoritative state.
  JOB_STATUS_REPORT_APPLIED = 1;

  // The Job already records this report, or has already moved past it. This
  // covers a retried report and a report that arrives after a later one.
  JOB_STATUS_REPORT_DUPLICATE = 2;

  // The Control Plane does not know the Job.
  JOB_STATUS_REPORT_UNKNOWN_JOB = 3;

  // The report contradicts the authoritative state, for example a second and
  // different terminal outcome, or a report from a process the Job is not
  // assigned to. The Job keeps the state it already recorded.
  JOB_STATUS_REPORT_CONFLICT = 4;
}

// JobLifecycleState mirrors the Control Plane Job lifecycle. It is reported
// back to the Runner for correlation and diagnosis only.
enum JobLifecycleState {
  JOB_LIFECYCLE_STATE_UNSPECIFIED = 0;
  JOB_LIFECYCLE_CREATED = 1;
  JOB_LIFECYCLE_QUEUED = 2;
  JOB_LIFECYCLE_RUNNING = 3;
  JOB_LIFECYCLE_SUCCEEDED = 4;
  JOB_LIFECYCLE_FAILED = 5;
  JOB_LIFECYCLE_CANCELLED = 6;
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string runner_version = 2;
} 
